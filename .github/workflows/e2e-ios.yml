name: E2E iOS (symulator)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      aplikacja_z_przebiegu:
        description: 'Numer przebiegu z gotową aplikacją'
        required: false
        default: ''
      urzadzenie:
        description: 'Wzorzec nazwy symulatora (np. "iPhone 16|iPhone 15")'
        required: false
        default: ''
      wyglad:
        description: 'Wygląd systemu symulatora: light albo dark'
        required: false
        default: 'light'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26.x / 16.x
        run: bash .github/scripts/select-xcode.sh 26 || bash .github/scripts/select-xcode.sh 16 || bash .github/scripts/select-xcode.sh 15

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: inputs.aplikacja_z_przebiegu == ''
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        if: inputs.aplikacja_z_przebiegu == ''
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install pods
        if: inputs.aplikacja_z_przebiegu == ''
        run: cd ios && pod install

      - name: Build (Release, symulator, bez podpisu)
        if: inputs.aplikacja_z_przebiegu == ''
        env:
          EXPO_PUBLIC_STORE_FAKE: '1'
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace Oczko.xcworkspace -scheme Oczko -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log
          test -d build/Build/Products/Release-iphonesimulator/Oczko.app

      - name: Zapis aplikacji (do ponownego użycia)
        if: inputs.aplikacja_z_przebiegu == ''
        run: cd ios/build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Oczko-sim.zip" Oczko.app

      - uses: actions/upload-artifact@v4
        if: inputs.aplikacja_z_przebiegu == ''
        with:
          name: oczko-sim-app
          path: Oczko-sim.zip
          retention-days: 1

      - uses: actions/download-artifact@v4
        if: inputs.aplikacja_z_przebiegu != ''
        with:
          name: oczko-sim-app
          run-id: ${{ inputs.aplikacja_z_przebiegu }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rozpakowanie aplikacji z wcześniejszego przebiegu
        if: inputs.aplikacja_z_przebiegu != ''
        run: mkdir -p ios/build/Build/Products/Release-iphonesimulator && unzip -q Oczko-sim.zip -d ios/build/Build/Products/Release-iphonesimulator

      - name: Simulator
        env:
          WANT: ${{ inputs.urzadzenie }}
          WYGLAD: ${{ inputs.wyglad }}
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version || echo "17.0")
          LIST=$(xcrun simctl list devices available)
          DEV=""
          for pat in ${WANT:+"$WANT"} "iPhone 16" "iPhone 15" "iPhone"; do
            DEV=$(printf '%s\n' "$LIST" | grep -m1 -E "$pat" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak dostępnego symulatora iPhone'a"; exit 1; }
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          [ "$WYGLAD" = dark ] && xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl install "$DEV" ios/build/Build/Products/Release-iphonesimulator/Oczko.app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version || true

      - name: Maestro
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          mkdir -p e2e-out
          set +e
          guard() { perl -e '$t=shift; $p=fork; if(!$p){setpgrp(0,0); exec @ARGV; exit 127} $SIG{ALRM}=sub{kill "TERM",-$p; sleep 5; kill "KILL",-$p; exit 124}; alarm $t; waitpid($p,0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "${MAESTRO_ALARM:-3600}" "$@"; }
          guard maestro --device "$SIM" test .maestro --exclude-tags=aktualizacja --format junit --output e2e-out/report.xml --test-output-dir e2e-out 2>&1 | tee /tmp/maestro-1.log
          rc=${PIPESTATUS[0]}
          exit $rc

      - name: Test aktualizacji na żywo (06-przygotuj -> nowa wersja bez uninstall -> 07-sprawdz)
        run: |
          set -o pipefail
          guard() { perl -e '$t=shift; $p=fork; if(!$p){setpgrp(0,0); exec @ARGV; exit 127} $SIG{ALRM}=sub{kill "TERM",-$p; sleep 5; kill "KILL",-$p; exit 124}; alarm $t; waitpid($p,0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' "${MAESTRO_ALARM:-1200}" "$@"; }
          guard maestro --device "$SIM" test .maestro/06-aktualizacja-przygotuj.yaml
          xcrun simctl terminate "$SIM" com.apps4brew.knitting || true
          xcrun simctl install "$SIM" ios/build/Build/Products/Release-iphonesimulator/Oczko.app
          guard maestro --device "$SIM" test .maestro/07-aktualizacja-sprawdz.yaml

      - name: Podsumowanie porażki ze zrzutem błędu
        if: failure()
        run: |
          find e2e-out -name "*.png" | head -4 | while IFS= read -r f; do
            echo "=== ZRZUT-BLEDU: $f"
            sips -Z 480 -s format jpeg -s formatOptions 35 "$f" --out /tmp/zrzut.jpg >/dev/null 2>&1 || continue
            echo "BEGIN-B64"; base64 -i /tmp/zrzut.jpg 2>/dev/null || true; echo "END-B64"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios
          retention-days: 1
          path: |
            e2e-out
            *.png
            .maestro/*.png
