# Testy Jest w 7 strefach czasowych (Rozdział 12.3 BRD, BR-TEST-038)
name: tests-tz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tests-tz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: jest (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Europe/Warsaw
          - UTC
          - America/Los_Angeles
          - Pacific/Kiritimati
          - Pacific/Pago_Pago
          - Asia/Kolkata
          - Australia/Lord_Howe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: uruchomienie testów w strefie ${{ matrix.tz }}
        run: TZ=${{ matrix.tz }} npx jest --maxWorkers=2
