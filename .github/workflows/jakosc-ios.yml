# iOS roli 07 (docs/jakosc/strategia.md §5; wzór: Trening e2e-ios.yml @928d0ff, docs/jakosc/e0/trening-wzorzec.md). Bez sekretów i bez podpisu.
# Aplikacja budowana RAZ (zadanie build, Release na symulator, CODE_SIGNING_ALLOWED=NO) → artefakt; scenariusze Maestro z e2e/scenariusze
# w częściach (scripts/ci/e2e-czesci.mjs, LPT z wagami). Pakiet: podstawowy (tag `podstawowy`, bramka TestFlight) albo pełny, gdy treść commitu
# zawiera „[e2e-pelny]” (DS-11a, P-092; po scaleniu do main pełny katalog nocą jak Trening). Ponowienie jednego nieudanego scenariusza tylko
# poza tagiem `stan-licznika` i wykazane osobno jako „w ponowieniu” (P-091 9a). Maszyna nieprzydzielona = ponowienie ręczne (P-091 10a, CLAUDE.md).
# PIERWSZY PRZEBIEG INFORMACYJNY (zasada roli 07 nr 8): build sprawdza potok; scenariusze nowej wersji padają, dopóki 08 nie zbuduje ekranów z testID z e2e/README.md.
name: Jakość · iOS
on:
  push:
    branches: [main, claude/jolly-thompson-paz6d8]
    paths:
      - 'app/**'
      - 'src/**'
      - 'modules/**'
      - 'targets/**'
      - 'e2e/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - 'scripts/natywne/czlonkostwo-celu.mjs'
      - '.github/scripts/jakosc/**'
      - '.github/workflows/jakosc-ios.yml'
      - 'docs/monetyzacja/wektory-*.json' # wektory czytane przez swift test (ADR-0007)
      - 'tests/wspolne/**'
      - 'tests/wektory/brd.json'
permissions:
  contents: read
concurrency:
  group: jakosc-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-test:
    # Pakiet reguł i rdzeń dziennika +1 (modules/oczko-reguly; ADR-0007 uzupełnienie, ADR-0008 (8), P-129 Q2a, jak Trening `cd targets && swift test`):
    # bez symulatora, na tych samych plikach JSON co Jest. Bramka od pierwszego zielonego przebiegu 40257126189 (zasada roli 07 nr 8; 08 partia 3, 3B).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Xcode 26.x (najnowszy z obrazu, P-091 5a)
        run: bash .github/scripts/jakosc/select-xcode.sh 26 && swift --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: swift test (wykonano N z N w logu)
        run: |
          set -o pipefail
          cd modules/oczko-reguly
          swift test 2>&1 | tee ../../swift-test.log
          { echo "### swift test"; grep -E 'wykonano [0-9]+ z [0-9]+|Executed [0-9]+ tests' ../../swift-test.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-log
          path: swift-test.log
          retention-days: 3
  build:
    runs-on: macos-26 # SDK 56+: Xcode 26.4+ (macos-15 ma najwyżej 26.3; Trening)
    timeout-minutes: 90 # Trening: build ~40 min (pods 2 + xcodebuild 36); zmierzyć w pierwszym przebiegu
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Xcode 26.x (najnowszy z obrazu, P-091 5a)
        run: bash .github/scripts/jakosc/select-xcode.sh 26 && xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: expo prebuild
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Intencja w celu aplikacji (_shared/Stuknij.swift; P-180)
        # @bacons/apple-targets dodaje targets/widget/_shared/* do celu aplikacji zbiorem wyjątków grupy synchronizowanej; bez tego
        # +1 z Live Activity nie ma intencji w procesie aplikacji. Test kontroli: tests/jakosc/czlonkostwo-celu.test.ts.
        run: |
          set -o pipefail # domyślny bash -e bez pipefail: kod skryptu zginąłby w potoku do tee
          node scripts/natywne/czlonkostwo-celu.mjs --pbxproj ios/*.xcodeproj/project.pbxproj --plik _shared/Stuknij.swift | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pods
        run: cd ios && pod install 2>&1 | tee pod-install.log
      - name: Cele natywne podłączone (ADR-0006, ADR-0007; 08 partia 3)
        # Moduł z wyższym minimum niż aplikacja jest po cichu pomijany („was not linked”) — build zostaje zielony bez modułu.
        run: |
          set -e
          if grep -q 'was not linked' ios/pod-install.log; then grep 'was not linked' ios/pod-install.log; echo "::error::moduł Expo niepodłączony"; exit 1; fi
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 18.0' ios/*.xcodeproj/project.pbxproj || { echo "::error::IPHONEOS_DEPLOYMENT_TARGET ≠ 18.0 (ADR-0006)"; exit 1; }
          for p in OczkoDziennikPlus OczkoCzasWTle; do grep -q "$p" ios/Podfile.lock || { echo "::error::brak poda $p"; exit 1; }; done
      - name: Platforma iOS zgodna z SDK (pobranie tylko, gdy jej brak)
        run: bash .github/scripts/jakosc/ensure-ios-platform.sh
      - name: Build (Release, symulator, bez podpisu)
        env:
          # Przełączniki testowe TYLKO w tym buildzie (strażnik: scripts/jakosc/sprawdz-workflowy.mjs, kontrole-repo.mjs; e2e/README.md)
          EXPO_PUBLIC_E2E: '1'
          EXPO_PUBLIC_STORE_FAKE: '1'
          EXPO_PUBLIC_ICLOUD_FAKE: '1' # atrapa silnika iCloud (P-230, moduly.md „Atrapa silnika w E2E”); kontrola ATRAPA-ICLOUD
          EXPO_PUBLIC_WATCH_FAKE: '1'
        run: |
          set -o pipefail
          cd ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          echo "Workspace $WS, schemat $SCHEME" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify
          ls -d build/Build/Products/Release-iphonesimulator/*.app
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          # Widżet osadzony i z kodem Live Activity; intencja i moduł w aplikacji (nazwy typów Swift w metadanych binarek)
          test -d "$APP/PlugIns/OczkoWidget.appex"
          # Do pliku, nie potokiem: grep -q kończy wcześnie, strings dostaje SIGPIPE i przy pipefail krok pada (przebieg 40262653714)
          strings -a "$APP/PlugIns/OczkoWidget.appex/OczkoWidget" > "$RUNNER_TEMP/widget.txt"
          strings -a "$APP/$(basename "$APP" .app)" > "$RUNNER_TEMP/aplikacja.txt"
          grep -q OczkoAktywnosc "$RUNNER_TEMP/widget.txt" || { echo "::error::widżet bez OczkoAktywnosc"; exit 1; }
          grep -q OczkoStuknij "$RUNNER_TEMP/aplikacja.txt" || { echo "::error::aplikacja bez intencji OczkoStuknij"; exit 1; }
          grep -q IntencjaEkranuBlokady "$RUNNER_TEMP/aplikacja.txt" || { echo "::error::aplikacja bez modułu OczkoDziennikPlus"; exit 1; }
          echo "Cele natywne: widżet, intencja i moduł w binarkach" >> "$GITHUB_STEP_SUMMARY"
      - name: Zapis aplikacji (do ponownego użycia przez części)
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          APP=$(ls -d *.app | head -1); zip -qry "$GITHUB_WORKSPACE/oczko-sim.zip" "$APP"
          echo "Aplikacja: $APP ($(du -sh "$APP" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oczko-sim-app
          path: oczko-sim.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          retention-days: 3
  e2e:
    name: e2e (część ${{ matrix.czesc }}, ${{ matrix.urzadzenie }})
    needs: build
    runs-on: macos-26
    # Pakiet podstawowy jest bramką od pierwszego zielonego przebiegu 40313538454 (P-180) — w KAŻDYM pakiecie: kroki liczą porażki tylko
    # scenariuszy z wyjścia `bramka` (tag `podstawowy`), resztę pełnego pakietu wypisują jako „czerwony-informacyjnie” (F07-15, P-198 Q1a).
    # Bez continue-on-error na zadaniu iPhone'a: przy „[e2e-pelny]” wyłączał też bramkę scenariuszy podstawowych (test tests/jakosc/e2e-bramka.test.ts).
    # iPad (tag `ipad`, P-225 Q1a): informacyjnie do pierwszego zielonego przebiegu (zasada roli 07 nr 8); scenariusze tylko przy [e2e-pelny]/[e2e-ipad].
    continue-on-error: ${{ matrix.urzadzenie == 'ipad' }}
    strategy:
      fail-fast: false
      matrix:
        urzadzenie: [iphone, ipad]
        czesc: [1, 2, 3] # = "czesci" w e2e/czesci.json (pakiet podstawowy: 2; część 3 kończy się wtedy bez symulatora)
        exclude: # iPad: jedna maszyna (czesci_ipad w e2e/czesci.json)
          - { urzadzenie: ipad, czesc: 2 }
          - { urzadzenie: ipad, czesc: 3 }
    timeout-minutes: 150 # rozruch symulatora ~8 min + krok Maestro z limitem timeout_min z planu (30 + 4 × scenariusze części)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts
      - name: Plan części
        id: plan
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PAKIET: ${{ matrix.urzadzenie == 'ipad' && 'ipad' || '' }} # iPad: pakiet `ipad` (bez [e2e-pelny]/[e2e-ipad] w commicie część kończy bez pracy)
        run: node scripts/ci/e2e-czesci.mjs czesc "${{ matrix.czesc }}" --out e2e-czesc
      - name: Xcode 26.x
        if: steps.plan.outputs.any == 'true'
        run: bash .github/scripts/jakosc/select-xcode.sh 26
      - uses: actions/setup-java@v4
        if: steps.plan.outputs.any == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.any == 'true'
        with:
          name: oczko-sim-app
      - name: Symulator
        if: steps.plan.outputs.any == 'true'
        env:
          URZADZENIE: ${{ matrix.urzadzenie }}
        run: |
          mkdir -p app-sim && unzip -q oczko-sim.zip -d app-sim
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          LIST=$(xcrun simctl list devices available | awk -v h="-- iOS $SDK --" '$0 == h { f = 1; next } /^-- / { f = 0 } f')
          [ -n "$LIST" ] || LIST=$(xcrun simctl list devices available)
          DEV=""
          if [ "$URZADZENIE" = ipad ]; then WZORY=("iPad Air" "iPad Pro" "iPad"); else WZORY=("iPhone 17 \(" "iPhone 16 \(" "iPhone"); fi
          for pat in "${WZORY[@]}"; do
            DEV=$(printf '%s\n' "$LIST" | node .github/scripts/jakosc/sim-wybor.mjs "$pat" || true)
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak symulatora ($URZADZENIE)"; exit 1; }
          echo "Symulator: $DEV (iOS $SDK)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" app-sim/*.app
      - name: Maestro
        if: steps.plan.outputs.any == 'true'
        env:
          MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION }} # przypięcie zmienną repozytorium (jak Trening); pusta = najnowsza, wersja w logu
        run: |
          [ -n "$MAESTRO_VERSION" ] || unset MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Scenariusze
        if: steps.plan.outputs.main == 'true'
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.timeout_min) }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000' # Trening: świeży symulator potrzebuje więcej czasu na sterownik XCTest
          MAESTRO_CLI_NO_ANALYTICS: '1'
          PONAWIALNE: ${{ steps.plan.outputs.ponawialne }}
          BRAMKA: ${{ steps.plan.outputs.bramka }}
        run: |
          mkdir -p e2e-out; porazki=0; : > e2e-out/wyniki.txt
          for f in e2e-czesc/[0-9][0-9]-*.yaml; do
            n=$(basename "$f" .yaml)
            if maestro --device "$SIM" test "$f" --format junit --output "e2e-out/$n.xml" --test-output-dir "e2e-out/$n"; then echo "zielony $n" >> e2e-out/wyniki.txt; continue; fi
            if [[ " $PONAWIALNE " == *" $n.yaml "* ]] && maestro --device "$SIM" test "$f" --format junit --output "e2e-out/$n.ponowienie.xml" --test-output-dir "e2e-out/$n.ponowienie"; then
              echo "w-ponowieniu $n" >> e2e-out/wyniki.txt # P-091 9a: liczony osobno, nie jako zaliczenie bez śladu
            elif [[ " $BRAMKA " == *" $n.yaml "* ]]; then
              echo "czerwony $n" >> e2e-out/wyniki.txt; porazki=$((porazki + 1))
              python3 .github/scripts/jakosc/maestro-failures.py "e2e-out/$n" || true
            else
              echo "czerwony-informacyjnie $n" >> e2e-out/wyniki.txt # poza pakietem podstawowym (F07-15)
              python3 .github/scripts/jakosc/maestro-failures.py "e2e-out/$n" || true
            fi
          done
          { echo "### Część ${{ matrix.czesc }} (${{ matrix.urzadzenie }})"; sort e2e-out/wyniki.txt | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          exit $porazki
      - name: Scenariusze w osobnym kroku (duży tekst AX5)
        if: steps.plan.outputs.osobne == 'true'
        env:
          BRAMKA: ${{ steps.plan.outputs.bramka }}
        run: |
          xcrun simctl ui "$SIM" content_size accessibility-extra-extra-extra-large
          mkdir -p e2e-out; porazki=0
          for f in e2e-czesc/osobne/[0-9][0-9]-*.yaml; do
            n=$(basename "$f" .yaml)
            if maestro --device "$SIM" test "$f" --format junit --output "e2e-out/$n.xml" --test-output-dir "e2e-out/$n"; then echo "- zielony $n (AX5)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ " $BRAMKA " == *" $n.yaml "* ]]; then echo "- czerwony $n (AX5)" >> "$GITHUB_STEP_SUMMARY"; porazki=$((porazki + 1))
            else echo "- czerwony-informacyjnie $n (AX5)" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          exit $porazki
      - name: Spakowanie wyników (Maestro zapisuje katalogi z „:” w nazwie scenariusza, których upload-artifact nie przyjmuje; run 40223597670)
        if: always() && steps.plan.outputs.any == 'true'
        run: '[ -d e2e-out ] && zip -qry e2e-out.zip e2e-out || true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.any == 'true'
        with:
          name: e2e-czesc-${{ matrix.czesc }}-${{ matrix.urzadzenie }}
          path: e2e-out.zip
          retention-days: 3
