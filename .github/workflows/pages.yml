# Strona aplikacji (strona produktu, polityka prywatności, wsparcie): GitHub Pages z katalogu site/ przez Actions — jak Trening pages.yml (P-093 (1)).
# Publikowany jest wyłącznie site/; bez sekretów; token tylko do odczytu treści i wdrożenia Pages. Adres: docs/wydanie/adres-strony.json.
# Uruchamianie: push na main albo ręcznie (P-219 D2: przed TestFlight także z gałęzi roboczej, za zgodą; wymaga reguły gałęzi w środowisku
# github-pages — docs/wydanie/sklep.md §2a). Bez macOS.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
