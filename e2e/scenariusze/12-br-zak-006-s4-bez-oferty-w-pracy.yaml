# BR-ZAK-006/S4 (docs/brd/wymagania-dane.md:330): bez oferty w trakcie pracy — przejście przepływów liczenia (PR-02), historii, menu, przypomnienia,
# nazwy i wpisania wartości bez ekranu zakupu i bez linii o Pro. Wyrocznia: KP-10, KP-13.
appId: com.apps4brew.knitting
name: "BR-ZAK-006/S4 · Bez oferty w trakcie pracy: liczenie, historia, menu, nazwa, wpisanie"
tags:
  - BR-ZAK-006-S4
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertNotVisible: { id: "oferty-ekran" }
- assertNotVisible: "Oczko Pro.*"
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus", repeat: 3, delay: 150 }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- assertNotVisible: "Oczko Pro.*"
- tapOn: { id: "baner-serii-cofnij" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertNotVisible: "Oczko Pro.*"
- tapOn: { id: "licznik-historia" }
- assertVisible: { id: "historia-lista" }
- assertNotVisible: "Oczko Pro.*"
- tapOn: { id: "arkusz-zamknij" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-nazwa" }
- assertNotVisible: "Oczko Pro.*"
- tapOn: { id: "arkusz-zamknij" }
- assertVisible: { id: "licznik-plus" }
- runFlow: subflows/nazwij-projekt.yaml
- assertNotVisible: "Oczko Pro.*"
- assertNotVisible: { id: "oferty-ekran" }
- takeScreenshot: 12-bez-oferty
