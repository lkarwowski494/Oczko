# Okno „Uczciwe zasady” (pakiet podstawowy): P-089 (3a) — jednorazowe, po pierwszym ukończonym dniu z robótką, tylko wersja darmowa;
# główny przycisk zamyka okno, link prowadzi do planów Pro; nigdy na ekranie licznika w trakcie liczenia (KP-10).
# Definicja „ukończonego dnia” [DO USTALENIA] Z07-09 (02): scenariusz przyjmuje propozycję 07 — otwarcie aplikacji następnego dnia po dniu z ≥ 1 +1.
# Teksty okna: rola 04 (Z07-05, okno nienarysowane) — scenariusz używa tylko testID.
appId: com.apps4brew.knitting
name: "P-089 (3a) · Okno „Uczciwe zasady”: raz, następnego dnia, główny przycisk zamyka, link do planów Pro"
tags:
  - P-089-3a
  - KP-10
  - podstawowy
  - stan-licznika
---
# --- dzień 1: liczenie, okna nie ma ---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T20:00:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertNotVisible: { id: "okno-uczciwe-zasady" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- assertNotVisible: { id: "okno-uczciwe-zasady" }
# --- dzień 2: okno raz; główny przycisk zamyka i zostawia licznik ---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-11T20:00:00"
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady" }, timeout: 60000 }
- assertVisible: { id: "uczciwe-zasady-zamknij" }
- assertVisible: { id: "uczciwe-zasady-plany-pro" }
- takeScreenshot: 07-okno-uczciwe-zasady
- tapOn: { id: "uczciwe-zasady-zamknij" }
- assertNotVisible: { id: "okno-uczciwe-zasady" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- assertNotVisible: { id: "oferty-ekran" }
# --- dzień 3: okno się nie powtarza ---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-12T20:00:00"
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 60000 }
- assertNotVisible: { id: "okno-uczciwe-zasady" }
# --- druga instalacja: link z okna prowadzi do planów Pro, „Not now” wraca do licznika ---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-20T20:00:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-21T20:00:00"
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady" }, timeout: 60000 }
- tapOn: { id: "uczciwe-zasady-plany-pro" }
- assertVisible: { id: "oferty-ekran" }
- assertVisible: { id: "oferty-plan-dozywotni" }
- takeScreenshot: 07-plany-z-okna
- tapOn: { id: "oferty-nie-teraz" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertNotVisible: { id: "okno-uczciwe-zasady" }
