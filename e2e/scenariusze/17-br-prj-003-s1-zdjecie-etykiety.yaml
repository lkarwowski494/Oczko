# BR-PRJ-003/S1 (docs/brd/wymagania-projekt.md:31): zdjęcie etykiety w projekcie — grupa „Photos” na ekranie projektu (04 fix-6 D, P-191 P9a; F07-17
# zamiast menu-zdjecia / zdjecia-licznik). Aparat w symulatorze niedostępny — build E2E dodaje do arkusza źródła
# pozycję „Test photo” (e2e-zdjecie-testowe, obraz z zasobów testowych, EXIF GPS celowo ustawiony — strategia §4). Plik w katalogu aplikacji (ADR-0001), odczyt offline.
appId: com.apps4brew.knitting
name: "BR-PRJ-003/S1 · Zdjęcie etykiety w projekcie, widoczne po restarcie bez sieci"
tags:
  - BR-PRJ-003-S1
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T12:00:00"
- runFlow: subflows/nazwij-projekt.yaml
- tapOn: { id: "licznik-projekt" }
- assertVisible: { id: "projekt-zdjecia" }
- scrollUntilVisible: { element: { id: "zdjecia-dodaj" } }
- tapOn: { id: "zdjecia-dodaj" }
- assertVisible: { id: "e2e-zdjecie-testowe" }
- tapOn: { id: "e2e-zdjecie-testowe" }
- extendedWaitUntil: { visible: { id: "zdjecia-miniatura" }, timeout: 20000 }
- assertVisible: { id: "zdjecia-miniatura", text: "Photo 1 of 1" }
- takeScreenshot: 17-zdjecie-etykiety
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T13:00:00" } }
- tapOn: { id: "licznik-projekt" }
- assertVisible: { id: "projekt-zdjecia" }
- scrollUntilVisible: { element: { id: "zdjecia-miniatura" } }
- assertVisible: { id: "zdjecia-miniatura", text: "Photo 1 of 1" }
