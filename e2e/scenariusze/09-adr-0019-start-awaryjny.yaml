# Start awaryjny (pakiet podstawowy): ADR-0019 „Potwierdzenie” — dwa wymuszone nieudane starty przed kamieniem milowym → trzeci start pokazuje ekran
# trybu awaryjnego; „Zapisz kopię danych” daje archiwum z licznościami jak w bazie; oryginał bazy ma ten sam SHA-256 przed i po (R-086).
# F07-19 (P-203 Q6a, N12-11): SHA pary `.db` + `-wal` liczone bez checkpointu, przy NIEPUSTYM WAL (drugi +1 po wejściu w tło nie jest
# przenoszony do .db) — inaczej własność jest trywialna (eksperyment docs/jakosc/narzedzia/n12-11-wal-checkpoint.mjs). Wymaga kodu 08:
# panel e2e-sha-bazy = SHA pary bez checkpointu, e2e-wal-bajty = rozmiar -wal, panel ukryty w trakcie liczenia; „Zapisz kopię” tylko do odczytu.
# Kontrola roli 12 (strategia §10): przełącznik wymuszonej awarii tylko w konfiguracji testowej (argument startu oczkoE2eAwariaStartu, build E2E),
# nieobecny w buildzie wydania (sprawdz-ipa.mjs). PROG_NIEUDANYCH_STARTOW = 2 (P-080, do weta). Ekran awaryjny: teksty 04/09 (Z07-05) — tu tylko testID.
# [DO USTALENIA] zachowanie Maestro po awarii procesu w trakcie launchApp (czy następne polecenie startuje aplikację ponownie) — rozstrzyga pierwszy przebieg macOS.
appId: com.apps4brew.knitting
name: "ADR-0019 · Start awaryjny po dwóch nieudanych startach: kopia z licznościami, oryginał bez zmian, „Spróbuj normalnie”"
tags:
  - ADR-0019
  - R-086
  - podstawowy
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
# --- SHA-256 pary .db + -wal przed awariami, bez checkpointu (panel diagnostyki E2E, tylko EXPO_PUBLIC_E2E=1); WAL musi być niepusty ---
- tapOn: { id: "nav-projekty" }
- assertVisible: { id: "projekty-lista" }
- tapOn: { id: "nav-ustawienia" }
- extendedWaitUntil: { visible: { id: "e2e-sha-bazy" }, timeout: 20000 }
- assertVisible: { id: "e2e-wal-bajty", text: "[1-9][0-9]*" }
- copyTextFrom: { id: "e2e-sha-bazy" }
- evalScript: ${output.shaPrzed = maestro.copiedText}
- assertTrue: ${output.shaPrzed.length == 64}
# --- dwa nieudane starty przed kamieniem milowym ---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-10T19:40:00"
      oczkoE2eAwariaStartu: "przed-kamieniem"
# Znacznik buildu E2E po zapisie stanu startu: bez niego Maestro zabijał proces ~1,5 s po aktywacji, przed JS (E2E 40306542928).
- extendedWaitUntil: { visible: { id: "e2e-awaria-startu" }, timeout: 60000 }
- assertNotVisible: { id: "licznik-plus" }
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-10T19:41:00"
      oczkoE2eAwariaStartu: "przed-kamieniem"
# Znacznik buildu E2E po zapisie stanu startu: bez niego Maestro zabijał proces ~1,5 s po aktywacji, przed JS (E2E 40306542928).
- extendedWaitUntil: { visible: { id: "e2e-awaria-startu" }, timeout: 60000 }
- assertNotVisible: { id: "licznik-plus" }
# --- trzeci start (bez przełącznika): ekran trybu awaryjnego, baza nietknięta ---
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-10T19:42:00"
- extendedWaitUntil: { visible: { id: "tryb-awaryjny" }, timeout: 60000 }
- assertVisible: { id: "awaryjny-zapisz-kopie" }
- assertVisible: { id: "awaryjny-sprobuj-normalnie" }
- assertVisible: { id: "awaryjny-zglos-problem" }
- assertNotVisible: { id: "licznik-plus" }
- takeScreenshot: 09-tryb-awaryjny
- tapOn: { id: "awaryjny-zapisz-kopie" }
- extendedWaitUntil: { visible: { id: "awaryjny-licznosci" }, timeout: 60000 }
- assertVisible: { id: "awaryjny-licznosci", text: "1 project.*1 counter.*2 changes.*" }
- takeScreenshot: 09-kopia-awaryjna
# panel SHA ukryty w trakcie liczenia po archiwum (kod 08), więc czekanie na jego pojawienie się daje wartość PO zamknięciu bazy
- extendedWaitUntil: { visible: { id: "e2e-sha-bazy" }, timeout: 20000 }
- copyTextFrom: { id: "e2e-sha-bazy" }
- assertTrue: ${maestro.copiedText == output.shaPrzed}
# --- „Spróbuj normalnie”: zwykły start, dane na miejscu ---
- tapOn: { id: "awaryjny-sprobuj-normalnie" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 60000 }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- assertNotVisible: { id: "tryb-awaryjny" }
