# Główny przepływ PR-02 (pakiet podstawowy, strategia §3 „E2E”): +1, −1, granica zera, seria stuknięć z banerem „Undo”, cofnięcie ostatniej zmiany z historii.
# Kryteria: BR-LIC-002/S1, S2, S3 (wymagania-licznik.md), BR-LIC-019/S1 (RD-17-W1), BR-LIC-003/S2; P-091 (3a): „Cofnij” tylko ostatnia zmiana albo seria na końcu.
# Teksty: design-spec „Baner strażnika” („Added 3 rows in 1 s. Undo?”, „Removed 3 rows. Back to 30.”), słownik „+1 row / −1”, „Undo”.
# Scenorys 04: z2-k1.png (po trzech szybkich stuknięciach), z2-k2.png (po Undo).
appId: com.apps4brew.knitting
name: "BR-LIC-002/S1–S3 + BR-LIC-019/S1 · +1, −1, granica zera, seria i Undo, cofnięcie z historii"
tags:
  - BR-LIC-002-S1
  - BR-LIC-002-S2
  - BR-LIC-002-S3
  - BR-LIC-019-S1
  - BR-LIC-003-S2
  - podstawowy
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
# --- granica zera: −1 przy 0 zostaje 0 (BR-LIC-002/S3) ---
- tapOn: { id: "licznik-minus" }
- assertVisible: { id: "licznik-wartosc", text: "0" }
- runFlow: subflows/odstep.yaml
# --- +1, +1, −1 (BR-LIC-002/S1, S2) ---
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-minus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertNotVisible: { id: "baner-serii" }
- takeScreenshot: 04-po-minus
- runFlow: subflows/odstep.yaml
# --- seria: 3 stuknięcia w < 2 s → baner strażnika bez limitu czasu (BR-LIC-019/S1, RD-17) ---
- tapOn: { id: "licznik-plus", repeat: 3, delay: 150 }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- assertVisible: { id: "baner-serii", text: "Added 3 rows in .*Undo\\?" }
- assertVisible: { id: "baner-serii-cofnij", text: "Undo 3 rows" }
- takeScreenshot: 04-baner-serii
- tapOn: { id: "baner-serii-cofnij" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertVisible: "Removed 3 rows\\. Back to 1\\."
- takeScreenshot: 04-po-undo-serii
- runFlow: subflows/odstep.yaml
# --- zwykłe +1, potem historia: „Undo” ostatniej zmiany (BR-LIC-003/S2, P-091 3a) ---
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- assertNotVisible: { id: "baner-serii" }
- tapOn: { id: "licznik-historia" }
- assertVisible: { id: "historia-lista" }
- takeScreenshot: 04-historia
- tapOn: { id: "historia-cofnij-ostatnia" }
- assertVisible: { id: "historia-lista" }
- tapOn: { id: "arkusz-zamknij" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
# --- trwałość po zabiciu procesu ---
- runFlow:
    file: subflows/restart.yaml
    env:
      TERAZ: "2026-11-10T19:45:00"
- assertVisible: { id: "licznik-wartosc", text: "1" }
