# NFR-WYD-001 (docs/brd/wymagania.md:105): reakcja licznika. Próg [DO USTALENIA] OP-17 (Z07-06); propozycja: p95 z 20 powtórzeń ≤ pomiar bazowy × 1,2.
# Pomiar informacyjny (strategia §10, 05-13): build E2E zapisuje czas od dotyku do wyrenderowania nowej wartości (e2e-pomiar-plus: „p95 … ms, n = 20”);
# wynik z zrzutu i logu trafia do artefaktu. Stuknięcia z odstępem > 2 s (bez banera serii RD-17).
appId: com.apps4brew.knitting
name: "NFR-WYD-001 · Reakcja licznika: 20 stuknięć z pomiarem (informacyjnie)"
tags:
  - NFR-WYD-001
  - pomiar
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "3" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "5" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "6" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "11" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "16" }
- assertVisible: { id: "licznik-wartosc", text: "20" }
- assertVisible: { id: "e2e-pomiar-plus", text: "p95 .* ms, n = 20" }
- takeScreenshot: 31-pomiar
