# BR-PRJ-016/S1–S2 (docs/brd/wymagania-projekt.md:200): projekt dawno nieruszany — „last worked …” w wierszu (bez progu i bez sekcji uśpionych,
# P-182, P-183 (1a); nazwany wyjątek od kontraktu 07 jak P-176, zmiana roli 08 w partii 5) i powrót jednym stuknięciem z listy.
# Wyrocznia: BR-PRJ-011. Czas: zegar wstrzyknięty (41 dni później, jak „last worked 41 days ago” w prototypie).
appId: com.apps4brew.knitting
name: "BR-PRJ-016/S2 · Po 41 dniach: ‘last worked 41 days ago’, jedno stuknięcie wraca do rzędu"
tags:
  - BR-PRJ-016-S2
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-10-01T19:30:00"
- runFlow: subflows/projekt-roboczy.yaml
- runFlow: subflows/nazwij-projekt.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "nav-projekty" }
- assertVisible: { id: "projekty-lista" }
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-11T19:30:00" } }
- tapOn: { id: "nav-projekty", optional: true }
- assertVisible: { id: "projekty-ostatnia-praca", text: "last worked 41 days ago" }
- assertVisible: "Harbor.*last worked 41 days ago.*"
- takeScreenshot: 20-uspione
- tapOn: "Harbor.*"
- assertVisible: { id: "licznik-projekt", text: "Harbor" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
