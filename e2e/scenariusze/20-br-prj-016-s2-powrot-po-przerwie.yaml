# BR-PRJ-016/S2 (docs/brd/wymagania-projekt.md:200): projekt dawno nieruszany — powrót jednym stuknięciem z listy (sekcja uśpionych, design-spec „Projekty”).
# Wyrocznia: BR-PRJ-011. Czas: zegar wstrzyknięty (41 dni później, jak „last worked 41 days ago” w prototypie).
appId: com.apps4brew.knitting
name: "BR-PRJ-016/S2 · Po 41 dniach: projekt w sekcji uśpionych, jedno stuknięcie wraca do rzędu"
tags:
  - BR-PRJ-016-S2
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-10-01T19:30:00"
- runFlow: subflows/nazwij-projekt.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "nav-projekty" }
- assertVisible: { id: "projekty-lista" }
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-11T19:30:00" } }
- tapOn: { id: "nav-projekty", optional: true }
- assertVisible: { id: "projekty-uspione" }
- assertVisible: "Harbor.*last worked 41 days ago.*"
- takeScreenshot: 20-uspione
- tapOn: "Harbor.*"
- assertVisible: { id: "licznik-projekt", text: "Harbor" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
