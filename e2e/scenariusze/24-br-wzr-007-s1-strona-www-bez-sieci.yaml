# BR-WZR-007/S1 (docs/brd/wymagania-projekt.md:274): Strona WWW zapisana jako wzór, otwierana bez sieci.
# Udostępnienie z Safari tylko urządzenie — build E2E podaje zapisany plik strony testowej; odczyt przy oczkoE2eSiec=brak.
# Reguła OG-07 (design-spec „Ekrany wzoru a patenty”): jeden dokument wzoru naraz, w całości.
appId: com.apps4brew.knitting
name: "BR-WZR-007/S1 · Strona WWW zapisana jako wzór, otwierana bez sieci"
tags:
  - BR-WZR-007-S1
  - wzor
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T12:00:00"
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- assertVisible: { id: "wzor-dodaj" }
- tapOn: { id: "wzor-dodaj" }
- assertVisible: { id: "e2e-wzor-www" }
- tapOn: { id: "e2e-wzor-www" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zrodlo", text: "Web page.*" }
- assertVisible: { id: "wzor-strona", text: "Page 1 of .*" }
- takeScreenshot: 24-wzor-po-imporcie
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T13:00:00" } }
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zrodlo", text: "Web page.*" }
- takeScreenshot: 24-wzor-po-restarcie-offline
