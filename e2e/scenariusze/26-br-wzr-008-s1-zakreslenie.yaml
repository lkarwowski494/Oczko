# BR-WZR-008/S1 (docs/brd/wymagania-projekt.md:295): zakreślenie mojego rozmiaru palcem na iPhonie; trwałość adnotacji (dane-node, R-059: XCTest PencilKit).
# Gest palcem po PDF: swipe Maestro w trybie zakreślacza (wzor-zakreslacz). Adnotacja na jednym dokumencie (OG-07).
appId: com.apps4brew.knitting
name: "BR-WZR-008/S1 · Zakreślenie palcem na wzorze, zachowane po restarcie"
tags:
  - BR-WZR-008-S1
  - wzor
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T12:00:00"
- runFlow: subflows/projekt-roboczy.yaml
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- assertVisible: { id: "wzor-dodaj" }
- tapOn: { id: "wzor-dodaj" }
- assertVisible: { id: "e2e-wzor-pdf" }
- tapOn: { id: "e2e-wzor-pdf" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zakreslenia", text: "0 highlights" }
- tapOn: { id: "wzor-zakreslacz" }
- assertVisible: { id: "wzor-zakreslacz", selected: true }
- swipe: { start: "20%, 40%", end: "80%, 40%", duration: 800 }
- assertVisible: { id: "wzor-zakreslenia", text: "1 highlight" }
- takeScreenshot: 26-zakreslenie
- tapOn: { id: "wzor-zakreslacz" }
- assertVisible: { id: "wzor-zakreslacz", selected: false }
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T13:00:00" } }
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zakreslenia", text: "1 highlight" }
