# Podprzepływ: kolejny dzień z robótką (restart z zegarem TERAZ na tych samych danych) i jedno +1, po którym licznik ma WARTOSC.
# Zużywa jeden darmowy dzień (P-057 D2/D3: nowy dzień = nowa data i przerwa ≥ 60 min). Scenariusz, który go woła, ma tag stan-licznika.
appId: com.apps4brew.knitting
name: "podprzepływ: dzień z robótką"
---
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: ${TERAZ}
      oczkoE2eSiec: "brak"
# P-089 (3a): jednorazowe okno „Uczciwe zasady” po pierwszym dniu z robótką (tylko darmowa) — zamykane głównym przyciskiem; sprawdza je 07-p-089-3a-uczciwe-zasady.yaml
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|licznik-plus|limit-zawczasu|projekty-lista" }, timeout: 60000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 60000 }
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "${WARTOSC}" }
