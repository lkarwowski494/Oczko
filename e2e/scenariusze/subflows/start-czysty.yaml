# Podprzepływ: czysta instalacja (clearState) z wstrzykniętym zegarem (Z07-18) i bez sieci.
# Parametr (env runFlow): TERAZ — czas lokalny ISO bez strefy, np. "2026-11-02T20:00:00"; zegar biegnie dalej od tej chwili (kontrakt: e2e/README.md).
appId: com.apps4brew.knitting
name: "podprzepływ: czysta instalacja z zegarem"
---
- launchApp:
    clearState: true
    arguments:
      oczkoE2eTeraz: ${TERAZ}
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "licznik-wartosc" }, timeout: 60000 } # górna część ekranu — czytelna także w orientacji z poprzedniego scenariusza
- setOrientation: PORTRAIT # orientacja symulatora przeżywa scenariusz, który padł w poziomie (przebieg 40446976426: 9 kaskadowych porażek po 23 — drzewo przycięte do wysokości poziomej, +1 poza nim)
- assertVisible: { id: "licznik-plus" }
