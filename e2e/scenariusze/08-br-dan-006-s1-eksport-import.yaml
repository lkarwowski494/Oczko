# Eksport i import archiwum .oczko (pakiet podstawowy): BR-DAN-005/S1, BR-DAN-006/S1 (obieg eksport → import), P-091 (6a): import „scal” po UUID, idempotentny;
# P-089 (3b): karta z planami Pro po udanym imporcie, tylko wersja darmowa (o ile import w MVP — rozstrzyga 03; bez importu ten krok wypada).
# ADR-0004 (archiwum), maszyna „Import archiwum” (moduly.md): sprawdzanie → gotowy → scal/zastąp → wczytywanie → gotowe.
# Systemowy wybór pliku i arkusz udostępniania są poza zasięgiem symulatora (Trening docs/38:75): build E2E ma panel „Test files” (tylko EXPO_PUBLIC_E2E=1),
# który zapisuje eksport w katalogu testowym i podaje ostatni eksport do importu bez okna systemowego. Okno systemowe: „Nie sprawdzono” (lista telefonu).
appId: com.apps4brew.knitting
name: "BR-DAN-006/S1 · Eksport archiwum, usunięcie danych, import i scalenie (liczności, idempotencja, karta Pro)"
tags:
  - BR-DAN-005-S1
  - BR-DAN-006-S1
  - P-089-3b
  - podstawowy
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: subflows/nazwij-projekt.yaml
# --- eksport z Ustawień ---
- tapOn: { id: "nav-projekty" }
- assertVisible: { id: "projekty-lista" }
- tapOn: { id: "nav-ustawienia" }
- assertVisible: { id: "ustawienia-eksport" }
- tapOn: { id: "ustawienia-eksport" }
- extendedWaitUntil: { visible: { id: "eksport-wynik" }, timeout: 30000 }
- assertVisible: { id: "eksport-licznosci", text: "1 project.*1 counter.*2 changes.*" }
- takeScreenshot: 08-eksport-gotowy
- tapOn: { id: "e2e-pliki-zachowaj-eksport" }
- assertVisible: { id: "e2e-pliki-stan", text: "Saved: 1 file" }
# --- usunięcie wszystkich danych (BR-DAN-009/S1), potem import ---
- tapOn: { id: "ustawienia-usun-wszystko" }
- assertVisible: { id: "potwierdz-usun-wszystko" }
- tapOn: { id: "potwierdz-usun-wszystko" }
- extendedWaitUntil: { visible: { id: "licznik-plus|projekty-lista" }, timeout: 30000 }
- tapOn: { id: "nav-ustawienia", optional: true }
- assertVisible: { id: "ustawienia-import" }
- tapOn: { id: "e2e-pliki-importuj-ostatni" }
- extendedWaitUntil: { visible: { id: "import-gotowy" }, timeout: 30000 }
- assertVisible: { id: "import-licznosci", text: "1 project.*1 counter.*2 changes.*" }
- takeScreenshot: 08-import-gotowy
- tapOn: { id: "import-scal" }
- extendedWaitUntil: { visible: { id: "import-wynik" }, timeout: 30000 }
- assertVisible: { id: "import-wynik", text: ".*1 project.*" }
# --- P-089 (3b): karta z planami Pro po udanym imporcie (wersja darmowa) ---
- assertVisible: { id: "karta-pro-po-imporcie" }
- takeScreenshot: 08-karta-pro-po-imporcie
- tapOn: { id: "karta-pro-zamknij" }
- assertNotVisible: { id: "karta-pro-po-imporcie" }
# --- drugi import tego samego pliku: scalenie idempotentne (P-091 6a, M-02) — bez duplikatów ---
- tapOn: { id: "e2e-pliki-importuj-ostatni" }
- extendedWaitUntil: { visible: { id: "import-gotowy" }, timeout: 30000 }
- tapOn: { id: "import-scal" }
- extendedWaitUntil: { visible: { id: "import-wynik" }, timeout: 30000 }
- assertVisible: { id: "import-wynik", text: ".*0 new.*" }
- tapOn: { id: "karta-pro-zamknij", optional: true }
- assertNotVisible: { id: "karta-pro-po-imporcie" }
- tapOn: { id: "nav-wstecz" }
- assertVisible: { id: "projekty-lista" }
- assertVisible: "Harbor"
- tapOn: "Harbor"
- assertVisible: { id: "licznik-wartosc", text: "2" }
- assertVisible: { id: "licznik-projekt", text: "Harbor" }
