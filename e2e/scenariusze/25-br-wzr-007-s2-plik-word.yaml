# BR-WZR-007/S2 (docs/brd/wymagania-projekt.md:278): Wzór z pliku Word: wierny render (P-071 5a), odczyt po restarcie.
# Jak BR-WZR-001/S1: plik .docx z domeny publicznej (strategia §4) podany przez panel E2E; porównanie zrzutu z wzorcem: R-060 (nocą).
# Reguła OG-07 (design-spec „Ekrany wzoru a patenty”): jeden dokument wzoru naraz, w całości.
appId: com.apps4brew.knitting
name: "BR-WZR-007/S2 · Wzór z pliku Word: wierny render (P-071 5a), odczyt po restarcie"
tags:
  - BR-WZR-007-S2
  - wzor
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T12:00:00"
- runFlow: subflows/projekt-roboczy.yaml
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- assertVisible: { id: "wzor-dodaj" }
- tapOn: { id: "wzor-dodaj" }
- assertVisible: { id: "e2e-wzor-word" }
- tapOn: { id: "e2e-wzor-word" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zrodlo", text: "Word.*" }
- assertVisible: { id: "wzor-strona", text: ".*[Pp]age 1 of .*" }
- takeScreenshot: 25-wzor-po-imporcie
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T13:00:00" } }
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wzor" }
- tapOn: { id: "menu-wzor" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "wzor-zrodlo", text: "Word.*" }
- takeScreenshot: 25-wzor-po-restarcie-offline
