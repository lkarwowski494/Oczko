<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oczko · clickable prototype (E3)</title>
<!-- Klikalny prototyp do przejścia poznawczego (P-061 (3a)). Kierunek A, Libre Franklin, tokeny.json. Tylko zachowanie ekranu; reguły (limit, strażnik) uproszczone do demonstracji: limit włącza przycisk „Simulate” poza telefonem. -->
<style>
@font-face { font-family: "Libre Franklin"; src: url("fonty/LibreFranklin.ttf"); font-weight: 100 900; }
@font-face { font-family: "Source Sans 3"; src: url("fonty/SourceSans3.ttf"); font-weight: 200 900; }
:root { --papier:#FCFCFA; --grupa:#F2F3F0; --grafit:#26282C; --olowek:#5E626A; --linia:#D9DBDF; --zakreslacz:#F6E04A; --na-zakreslaczu:#1B1C1F; --zakr-krawedz:#8C7A00; --p-tlo:#26282C; --p-tekst:#FCFCFA; --p-obrys:#26282C; --kreska:#26282C; --arkusz:#FCFCFA; }
* { box-sizing: border-box; }
main *, .symulacja { font-feature-settings: "tnum" 1; }
body { margin: 0; padding: 24px; background: #8A8D93; font-family: "Source Sans 3", sans-serif; display: flex; gap: 24px; align-items: flex-start; }
#tel { width: 390px; height: 844px; background: var(--papier); color: var(--grafit); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.status { height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font: 600 15px "Source Sans 3"; flex-shrink: 0; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 0; min-height: 44px; }
.nav button.link { background: none; border: 0; color: var(--grafit); font: 17px "Source Sans 3"; min-height: 44px; padding: 0; }
.ikona { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--grafit); font-size: 18px; }
.ikona[aria-pressed="true"] { background: var(--grafit); color: var(--papier); border-radius: 10px; }
h1 { font: 700 30px/1.15 "Libre Franklin"; margin: 4px 20px 0; }
.pod { margin: 4px 20px 0; color: var(--olowek); font-size: 17px; }
.kartka { margin: 14px 20px 0; border-top: 1px solid var(--linia); padding-top: 12px; }
.liczba { display: flex; align-items: baseline; gap: 12px; } .n { font: 700 96px/1 "Libre Franklin"; letter-spacing: -0.02em; } .z { font-size: 20px; color: var(--olowek); }
.cel { display: flex; justify-content: space-between; color: var(--olowek); font-size: 15px; margin-top: 4px; }
.podpis { color: var(--olowek); font-size: 15px; margin: 12px 0 0; }
svg.tally { display: block; width: 100%; height: 60px; margin-top: 4px; }
.instr { margin-top: 14px; position: relative; padding: 12px 16px 12px 20px; }
.instr::before { content: ""; position: absolute; inset: 0; background: var(--zakreslacz); transform: skewX(-4deg); border-left: 4px solid var(--zakr-krawedz); }
.instr > * { position: relative; color: var(--na-zakreslaczu); } .instr b { font: 700 20px/1.2 "Libre Franklin"; display: block; } .instr span { font-size: 17px; }
.nastepne { color: var(--olowek); font-size: 15px; margin-top: 10px; }
.spacer { flex: 1; }
.dol { padding: 12px 16px 32px; display: flex; gap: 28px; align-items: flex-end; flex-shrink: 0; }
.minus { width: 72px; height: 72px; border: 2px solid var(--grafit); background: transparent; color: var(--grafit); font: 700 28px "Libre Franklin"; border-radius: 14px; }
.plus { flex: 1; min-height: 168px; background: var(--p-tlo); color: var(--p-tekst); border: 2px solid var(--p-obrys); border-radius: 20px; font: 700 28px/1.2 "Libre Franklin"; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; }
.plus small { font: 400 15px/1.3 "Source Sans 3"; opacity: .85; }
.zablokowany .plus, .zablokowany .minus { opacity: .45; }
.baner { margin: 12px 16px 0; background: var(--grafit); color: var(--papier); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 17px; }
.teraz { margin: 4px 20px 0; font: 600 20px/1.2 "Source Sans 3"; }
.info { margin: 10px 20px 0; padding: 10px 12px; border-radius: 10px; background: var(--grupa); font-size: 17px; }
.pasek-blokady { margin: 8px 16px 0; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--grafit); display: flex; justify-content: space-between; align-items: center; font: 600 17px "Source Sans 3"; }
.pasek-blokady button { min-height: 44px; border: 0; background: none; font: 700 17px "Libre Franklin"; text-decoration: underline; }
.limit-zawczasu { margin: 0 16px 32px; padding: 16px; border-radius: 20px; border: 2px solid var(--grafit); display: flex; flex-direction: column; gap: 6px; font-size: 17px; }
.limit-zawczasu b { font: 700 20px/1.2 "Libre Franklin"; }
.plan { display: flex; justify-content: space-between; width: 100%; min-height: 52px; padding: 12px 14px; margin-top: 8px; border-radius: 14px; border: 2px solid var(--linia); background: transparent; font: 17px "Libre Franklin"; color: var(--grafit); }
.plan[aria-checked="true"] { border-color: var(--grafit); }
.baner button { margin-left: auto; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--papier); background: transparent; color: var(--papier); font: 700 17px "Libre Franklin"; }
.przyciemnienie { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 8; }
.arkusz { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 56px); overflow-y: auto; background: var(--arkusz); border-radius: 12px 12px 0 0; padding: 8px 20px 28px; z-index: 9; }
.uchwyt { width: 36px; height: 5px; border-radius: 3px; background: var(--linia); margin: 0 auto 12px; }
.arkusz h2 { font: 700 24px/1.2 "Libre Franklin"; margin: 4px 0 8px; } .arkusz p { font-size: 17px; line-height: 1.35; margin: 0 0 12px; }
.pelny { width: 100%; min-height: 52px; border-radius: 14px; border: 2px solid var(--p-obrys); background: var(--p-tlo); color: var(--p-tekst); font: 700 17px "Libre Franklin"; margin-top: 8px; }
.tekstowy { width: 100%; min-height: 44px; border: 0; background: transparent; color: var(--grafit); font: 600 17px "Source Sans 3"; margin-top: 4px; }
.pole { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linia); font-size: 17px; }
.pole input { width: 84px; font: 600 17px "Source Sans 3"; padding: 8px; border-radius: 10px; border: 1px solid var(--linia); text-align: right; background: var(--grupa); }
.lista { font-size: 15px; color: var(--olowek); margin: 10px 0; line-height: 1.5; }
.historia div { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linia); font-size: 17px; }
.historia button { min-height: 44px; border: 0; background: none; font: 600 17px "Source Sans 3"; color: var(--grafit); text-decoration: underline; }
.menu button { display: block; width: 100%; text-align: left; min-height: 48px; border: 0; border-bottom: 1px solid var(--linia); background: none; font: 17px "Source Sans 3"; color: var(--grafit); }
.symulacja { width: 260px; background: #fff; padding: 16px; font: 15px/1.4 "Source Sans 3"; border-radius: 12px; }
.symulacja button { width: 100%; min-height: 40px; margin-top: 8px; }
</style>
</head>
<body>
<div id="tel" data-ekran="prototyp"></div>
<div class="symulacja"><b>Outside the phone (demo only)</b><p>Simulates the passage of time for the walkthrough.</p>
  <button id="sym-dzien">Simulate: next evening, 5 of 5 free days used</button>
  <label><input type="checkbox" id="sym-zawczasu"> Variant: show the limit before knitting (STOP E3 decision)</label>
  <button id="sym-reset">Reset prototype</button></div>
<script>
// Stan prototypu
const S0 = () => ({ ekran: 'licznik', projekt: null, czesc: null, rzedy: 0, cel: null, sesja: 0, historia: [], blokada: false, przyp: null, nowyDzienNaLimicie: false, limitPokazany: false, arkusz: null, baner: null, info: null, stuk: [], inne: [['Socks for Ola', 'Second sock · row 12 · last worked 3 days ago'], ['Moss blanket', 'Square 9 · row 20 · last worked 41 days ago']] });
let S = S0();
const tel = document.getElementById('tel');
const teraz = () => new Date().toTimeString().slice(0, 5);
function rzedyPrzyp(p) { if (!p) return []; return Array.from({ length: p.razy }, (_, i) => p.od + i * p.co); }
function nastepnyPrzyp() { const r = rzedyPrzyp(S.przyp).filter((x) => x >= S.rzedy + 1); return r.length ? r[0] : null; }
function kreski(n) {
  let x = 6, o = ''; const pokaz = Math.min(n, 25);
  for (let i = 0; i < pokaz; i++) {
    if (i % 5 < 4) { const j = ((i * 37) % 7 - 3) * 0.6; o += `<path d="M${x + j} 10 q 2 22 ${-1 + j / 2} 44" stroke="var(--kreska)" stroke-width="3.2" fill="none" stroke-linecap="round"/>`; x += 12; }
    else { o += `<path d="M${x - 54} 48 L ${x - 2} 16" stroke="var(--kreska)" stroke-width="3.2" stroke-linecap="round"/>`; x += 20; }
  }
  return `<svg class="tally" viewBox="0 0 350 64" aria-hidden="true">${o}</svg>`;
}
function plus() {
  if (S.blokada) { S.info = 'Counter is locked. Unlock it at the top.'; return render(); }
  if (S.nowyDzienNaLimicie) { S.arkusz = 'limit'; return render(); }
  S.info = null; if (S.baner && S.baner.akcja) S.baner = null;
  if (!S.projekt) { S.projekt = 'Project 1'; S.czesc = null; }
  S.rzedy++; S.sesja++; S.historia.unshift({ czas: teraz(), z: S.rzedy - 1, na: S.rzedy });
  const t = Date.now(); S.stuk = [...S.stuk.filter((x) => t - x <= 2000), t];
  if (S.stuk.length >= 3) { const n = S.stuk.length; S.baner = { tekst: `Added ${n} rows in ${((t - S.stuk[0]) / 1000).toFixed(1)} s. Undo?`, akcja: 'cofnij-serie', n }; }
  render();
}
function minus() { if (S.blokada || S.rzedy === 0) return; S.rzedy--; S.sesja = Math.max(0, S.sesja - 1); S.historia.unshift({ czas: teraz(), z: S.rzedy + 1, na: S.rzedy }); render(); }
function cofnijSerie(n) { for (let i = 0; i < n; i++) { S.rzedy--; S.sesja = Math.max(0, S.sesja - 1); } S.historia.unshift({ czas: teraz(), z: S.rzedy + n, na: S.rzedy, opis: 'undo' }); S.stuk = []; S.baner = null; S.info = `Removed ${n} rows. Back to ${S.rzedy}.`; render(); }
function ekranLicznika() {
  const np = nastepnyPrzyp(), wTymRzedzie = np === S.rzedy + 1;
  const tytul = S.czesc || S.projekt || 'Counter';
  return `<div class="status"><span>21:14</span><span>▂▄▆ ▭</span></div>
  <div class="nav"><button class="link" data-a="projekty">${S.projekt ? '‹ Projects' : 'Projects'}</button><div style="display:flex">
    <button class="ikona" data-a="historia" aria-label="History">◷</button>
    ${S.projekt ? '<button class="ikona" data-a="menu" aria-label="Project options: name, goal, reminder, finish">•••</button>' : ''}</div></div>
  ${S.blokada ? '<div class="pasek-blokady" role="status">Counter locked <button data-a="blokada">Unlock</button></div>' : ''}
  ${S.czesc ? `<p class="pod" style="margin-top:2px">${S.projekt}</p>` : ''}
  <h1 data-a="${S.projekt ? 'menu' : ''}">${tytul}</h1>${S.projekt ? `<p class="teraz">Now working row ${S.rzedy + 1}</p>` : ''}
  ${S.baner ? `<div class="baner" role="alert"><span>${S.baner.tekst}</span>${S.baner.akcja ? `<button data-a="baner" aria-label="Undo ${S.baner.n} rows">Undo</button>` : ''}</div>` : ''}
  ${S.info ? `<p class="info" role="status">${S.info}</p>` : ''}
  ${S.nowyDzienNaLimicie && S.limitZawczasu ? '<p class="podpis" style="margin:8px 20px 0"><button class="link" data-a="oferty" style="text-decoration:underline">Oczko Pro removes the limit</button></p>' : ''}
  <div class="kartka">
    <div class="liczba"><span class="n" aria-hidden="true">${S.rzedy}</span><span class="sr" aria-live="polite" style="position:absolute;left:-9999px">${S.rzedy}${S.cel ? ' of ' + S.cel : ''} done, now row ${S.rzedy + 1}</span><span class="z">${S.cel ? 'of ' + S.cel : (S.rzedy === 1 ? 'row' : 'rows')}</span></div>
    ${S.cel ? `<div class="cel"><span>Goal ${S.cel} rows</span><span>${Math.max(0, S.cel - S.rzedy)} to go</span></div>` : ''}
    ${S.rzedy === 0 && !S.projekt ? '<p class="podpis" style="font-size:17px">Tap the big button each time you finish a row. Each row gets a pencil mark here.</p>' : S.nowyDzienNaLimicie ? '' : `<p class="podpis">Marks this session: ${S.sesja} ${S.sesja === 1 ? 'row' : 'rows'}</p>${kreski(S.sesja)}`}
    ${wTymRzedzie ? `<div class="instr" role="status"><b>Row ${np}: ${S.przyp.tekst}</b><span>${S.przyp.tekstKrotki} ${rzedyPrzyp(S.przyp).indexOf(np) + 1} of ${S.przyp.razy}${rzedyPrzyp(S.przyp)[rzedyPrzyp(S.przyp).indexOf(np) + 1] ? ' · next on row ' + rzedyPrzyp(S.przyp)[rzedyPrzyp(S.przyp).indexOf(np) + 1] : ''}</span></div>` : (np ? `<p class="nastepne">Next: row ${np}, ${S.przyp.tekst}</p>` : '')}
  </div>
  <div class="spacer"></div>
  ${S.nowyDzienNaLimicie && S.limitZawczasu ? `<div class="limit-zawczasu" role="status"><b>No free crafting days left in November</b><span>Counting is paused until December 1. Your ${S.rzedy} rows and everything else are kept.</span></div>` :
  `<div class="dol ${S.blokada ? 'zablokowany' : ''}"><button class="minus" data-a="minus" aria-label="−1 row">−1</button><button class="plus" data-a="plus" aria-label="+1 row${S.projekt ? ', when row ' + (S.rzedy + 1) + ' is done' : ''}">+1 row${S.projekt ? `<small>tap when row ${S.rzedy + 1} is done</small>` : ''}</button></div>`}`;
}
function ekranProjektow() {
  return `<div class="status"><span>21:30</span><span>▂▄▆ ▭</span></div><div class="nav"><button class="link" data-a="licznik">‹ Counter</button><span></span></div><h1>Projects</h1>
  ${S.info ? `<p class="info" role="status" style="margin:12px 20px 0">${S.info}</p>` : ''}
  <div style="margin:16px"><p class="podpis">In progress</p>${S.projekt ? `<div class="pole"><span>${S.projekt}${S.czesc ? ' · ' + S.czesc : ''}</span><span>row ${S.rzedy}</span></div>` : ''}${S.inne.map(([n, d]) => `<div class="pole"><span>${n}<br><small style="color:var(--olowek)">${d}</small></span><span>›</span></div>`).join('')}
  ${S.ukonczone ? `<p class="podpis">Finished</p><div class="pole"><span>${S.ukonczone}<br><small style="color:var(--olowek)">${S.wloczkaZapis || ''}</small></span><span>✓</span></div>` : ''}</div>`;
}
function arkusz() {
  const a = S.arkusz;
  if (a === 'historia') return `<h2>History</h2><div class="historia">${S.historia.slice(0, 8).map((h, i) => `<div><span>${h.czas} · ${h.z} → ${h.na}${h.opis ? ' (' + h.opis + ')' : ''}</span>${i === 0 ? '<button data-a="cofnij-ostatnia">Undo</button>' : ''}</div>`).join('') || '<p>No changes yet.</p>'}</div><button class="tekstowy" data-a="zamknij">Close</button>`;
  if (a === 'menu') return `<h2>${S.projekt}</h2><div class="menu"><button data-a="f-nazwa">Name project and part</button><button data-a="f-cel">Set a goal for this part</button><button data-a="f-przyp">Add a reminder (“every N rows”)</button><button data-a="f-wpisz">Enter the row number</button><button data-a="blokada">${S.blokada ? 'Unlock counter' : 'Lock counter (ignore taps)'}</button><button data-a="f-ukoncz">Mark project as finished</button></div><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  if (a === 'f-nazwa') return `<h2>Name</h2><div class="pole"><label for="i-proj">Project</label><input id="i-proj" aria-label="Project" value="Harbor Sweater" style="width:200px;text-align:left"></div><div class="pole"><label for="i-cz">Part</label><input id="i-cz" aria-label="Part" value="Left sleeve" style="width:200px;text-align:left"></div><p class="lista">A part is a piece you count separately: a sleeve, the back, a sock.</p><button class="pelny" data-a="zapisz-nazwa">Save</button><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  if (a === 'f-cel') return `<h2>Goal for this part</h2><div class="pole"><label for="i-cel">Rows in this part</label><input id="i-cel" aria-label="Rows in this part" inputmode="numeric" value="96"></div><button class="pelny" data-a="zapisz-cel">Save</button><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  if (a === 'f-wpisz') return `<h2>Enter the row number</h2><p>For a piece you started on paper or in another app.</p><div class="pole"><label for="i-wpisz">Rows already finished</label><input id="i-wpisz" inputmode="numeric" value="${S.rzedy}"></div><p class="lista" id="podglad-wpisz">You’ll continue on row ${S.rzedy + 1}.</p><button class="pelny" data-a="zapisz-wpisz">Save</button><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  if (a === 'f-przyp') {
    const p = { od: +(document.getElementById('i-od')?.value || 12), co: +(document.getElementById('i-co')?.value || 6), razy: +(document.getElementById('i-razy')?.value || 8) };
    return `<h2>Reminder</h2><p>As written in your pattern, e.g. “decrease every 6th row 8 times”.</p>
    <div class="pole"><label for="i-tekst">What to do</label><input id="i-tekst" aria-label="What to do" value="decrease at both ends" style="width:200px;text-align:left"></div>
    <div class="pole"><label for="i-od">Starting on row</label><input id="i-od" aria-label="Starting on row" inputmode="numeric" value="${p.od}"></div><div class="pole"><label for="i-co">Every … rows</label><input id="i-co" aria-label="Every … rows" inputmode="numeric" value="${p.co}"></div><div class="pole"><label for="i-razy">How many times</label><input id="i-razy" aria-label="How many times" inputmode="numeric" value="${p.razy}"></div>
    <p class="lista">You’ll be reminded on rows: ${rzedyPrzyp(p).join(', ')}</p><button class="pelny" data-a="zapisz-przyp">Save reminder</button><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  }
  if (a === 'limit') return `<h2>Row ${S.rzedy + 1} wasn’t added</h2><p>Your 5 free crafting days for November are used. A crafting day starts with your first row that day; they come back on December 1.</p><p>Nothing is lost: your ${S.rzedy} rows, projects, history and export all stay.</p><p style="color:var(--olowek)">Oczko Pro removes the monthly limit.</p><button class="pelny" data-a="oferty">See Oczko Pro</button><button class="tekstowy" data-a="zamknij">Not now</button>`;
  if (a === 'oferty') return `<h2>Oczko Pro</h2><p>Count rows on as many days as you like. Everything else stays the same.</p><div role="radiogroup" aria-label="Plans"><button class="plan" role="radio" aria-checked="false"><b>Monthly</b><b>$0.99 / month</b></button><button class="plan" role="radio" aria-checked="true"><b>Yearly</b><b>$6.99 / year</b></button><button class="plan" role="radio" aria-checked="false"><b>Lifetime</b><b>$14.99 once</b></button></div><p class="lista">Subscriptions renew until you cancel in your Apple ID settings. Without Pro: 5 crafting days every month, and all your data, always.</p><button class="pelny" data-a="zamknij">Close (demo: no purchase)</button><button class="tekstowy">Restore purchases</button>`;
  if (a === 'f-ukoncz') return `<h2>Finish all of ${S.projekt}?</h2>${S.cel && S.rzedy < S.cel ? `<p><b>${S.czesc || 'This part'}: ${S.rzedy} of ${S.cel} rows</b> — the goal isn’t reached yet.</p>` : ''}<p>The whole project moves to Finished. You can still open it, edit it and export it.</p><button class="pelny" data-a="ukoncz">Mark as finished</button><button class="tekstowy" data-a="zamknij">Cancel</button>`;
  if (a === 'karta') return `<h2>${S.ukonczone} · finished</h2><div class="liczba"><span class="n" style="font-size:72px">${S.kartaRzedy}</span><span class="z">rows</span></div>${S.kartaSesja ? `<p class="podpis">The last evening: ${S.kartaSesja} ${S.kartaSesja === 1 ? 'row' : 'rows'}</p>${kreski(S.kartaSesja)}` : ''}<p class="lista">Yarn from your stash used in this project:</p><div class="pole"><label for="i-wloczka">Fjord Wool, Slate — left over</label><input id="i-wloczka" placeholder="e.g. 1 skein or 40 g" style="width:150px"></div><button class="pelny" data-a="zamknij-karta">Done</button>`;
  return '';
}
function render() {
  tel.innerHTML = (S.ekran === 'licznik' ? ekranLicznika() : ekranProjektow()) +
    (S.arkusz ? `<div class="przyciemnienie" data-a="zamknij"></div><div class="arkusz" role="dialog"><div class="uchwyt"></div>${arkusz()}</div>` : '');
}
tel.addEventListener('input', (e) => { if (e.target.id === 'i-wpisz') document.getElementById('podglad-wpisz').textContent = `You’ll continue on row ${(+e.target.value || 0) + 1}.`; if (S.arkusz === 'f-przyp' && ['i-od', 'i-co', 'i-razy'].includes(e.target.id)) { const p = { od: +document.getElementById('i-od').value, co: +document.getElementById('i-co').value, razy: +document.getElementById('i-razy').value }; tel.querySelector('.lista').textContent = 'You’ll be reminded on rows: ' + rzedyPrzyp(p).join(', '); } });
tel.addEventListener('click', (e) => {
  const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
  const v = (id) => document.getElementById(id)?.value;
  const akcje = {
    plus, minus,
    blokada: () => { S.blokada = !S.blokada; S.baner = null; render(); },
    historia: () => { S.arkusz = 'historia'; render(); }, menu: () => { S.arkusz = 'menu'; S.info = null; render(); },
    zamknij: () => { S.arkusz = null; render(); },
    'cofnij-ostatnia': () => { const h = S.historia[0]; S.rzedy = h.z; S.historia.unshift({ czas: teraz(), z: h.na, na: h.z, opis: 'undo' }); S.arkusz = null; render(); },
    baner: () => cofnijSerie(S.baner.n),
    projekty: () => { S.ekran = 'projekty'; S.arkusz = null; render(); }, licznik: () => { S.ekran = 'licznik'; render(); },
    'f-nazwa': () => { S.arkusz = 'f-nazwa'; render(); }, 'f-cel': () => { S.arkusz = 'f-cel'; render(); }, 'f-przyp': () => { S.arkusz = 'f-przyp'; render(); }, 'f-wpisz': () => { S.arkusz = 'f-wpisz'; render(); }, 'f-ukoncz': () => { S.arkusz = 'f-ukoncz'; render(); },
    'zapisz-nazwa': () => { S.projekt = v('i-proj'); S.czesc = v('i-cz'); S.arkusz = null; render(); },
    'zapisz-cel': () => { S.cel = +v('i-cel'); S.arkusz = null; render(); },
    'zapisz-wpisz': () => { if (S.nowyDzienNaLimicie) { S.arkusz = 'limit'; return render(); } const n = +v('i-wpisz'); S.historia.unshift({ czas: teraz(), z: S.rzedy, na: n, opis: 'entered' }); S.rzedy = n; S.arkusz = null; render(); },
    'zapisz-przyp': () => { S.przyp = { tekst: v('i-tekst'), tekstKrotki: 'Reminder', od: +v('i-od'), co: +v('i-co'), razy: +v('i-razy') }; if (/decrease/i.test(S.przyp.tekst)) S.przyp.tekstKrotki = 'Decrease'; const minione = rzedyPrzyp(S.przyp).filter((x) => x <= S.rzedy).length; S.info = `Reminder saved.${minione ? ` ${minione} of ${S.przyp.razy} were before row ${S.rzedy + 1}.` : ''} Next: row ${nastepnyPrzyp()}.`; S.arkusz = null; render(); },
    oferty: () => { S.arkusz = 'oferty'; render(); },
    ukoncz: () => { S.ukonczone = S.projekt; S.kartaRzedy = S.rzedy; S.kartaSesja = S.sesja; S.arkusz = 'karta'; render(); },
    'zamknij-karta': () => { const u = S.ukonczone, w = v('i-wloczka'); S = { ...S0(), ukonczone: u, wloczkaZapis: w ? 'Yarn left: ' + w : '' }; S.ekran = 'projekty'; S.info = `${u} moved to Finished.${w ? ' Saved: ' + w + ' left.' : ''}`; render(); },
  };
  akcje[a]?.();
});
document.getElementById('sym-dzien').onclick = () => { S.nowyDzienNaLimicie = true; S.limitZawczasu = document.getElementById('sym-zawczasu').checked; S.sesja = 0; S.baner = null; S.info = null; render(); };
document.getElementById('sym-reset').onclick = () => { S = S0(); render(); };
render();
</script>
