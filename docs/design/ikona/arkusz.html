<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;font:14px "Source Sans 3",sans-serif;background:#fff}
.tapeta{display:flex;gap:28px;align-items:flex-end;padding:24px;border-radius:16px;margin-bottom:16px}
.jasna{background:linear-gradient(135deg,#dfe7ee,#f6efe4)} .ciemna{background:linear-gradient(135deg,#1d2430,#30263a);color:#eee}
img{display:block} .m{border-radius:22.4%} .k{border-radius:50%} figure{margin:0;text-align:center} figcaption{margin-top:6px}
</style></head><body>
<div class="tapeta jasna">
<figure><img class="m" src="icon.png" width="180"><figcaption>180 pt</figcaption></figure>
<figure><img class="m" src="icon.png" width="60"><figcaption>60</figcaption></figure>
<figure><img class="m" src="icon.png" width="29"><figcaption>29</figcaption></figure>
<figure><img class="m" src="ios-dark.png" width="60"><figcaption>ciemna 60</figcaption></figure>
<figure><img class="k" src="watch.png" width="100"><figcaption>zegarek</figcaption></figure>
<figure><img src="android-foreground.png" width="100" style="background:#FCFCFA;border-radius:50%"><figcaption>Android (maska koło)</figcaption></figure>
</div>
<div class="tapeta ciemna">
<figure><img class="m" src="ios-dark.png" width="180"><figcaption>180 pt</figcaption></figure>
<figure><img class="m" src="ios-dark.png" width="60"><figcaption>60</figcaption></figure>
<figure><img class="m" src="ios-dark.png" width="29"><figcaption>29</figcaption></figure>
<figure><img class="m" src="icon.png" width="60"><figcaption>jasna 60</figcaption></figure>
<figure><img src="android-monochrome.png" width="100" style="background:#556;border-radius:50%"><figcaption>Android mono</figcaption></figure>
</div></body></html>
