appId: com.apps4brew.knitting
---
- launchApp
# Modal powitalny (OnboardingModal) przy pierwszym uruchomieniu zasłania zakładki — zamykamy go, gdy jest (DEC-35)
- runFlow:
    when:
      visible:
        id: "onboarding-start-btn"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-start-btn"
      - tapOn:
          id: "onboarding-start-btn"
- tapOn: "Licznik"
- assertVisible: "Licznik"
- tapOn: "Projekty"
- assertVisible: "Projekty"
- tapOn: "Magazyn"
- assertVisible: "Magazyn"
- tapOn: "Warsztat"
- assertVisible: "Warsztat"
- tapOn: "Licznik"
