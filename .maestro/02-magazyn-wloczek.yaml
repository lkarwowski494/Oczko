appId: com.apps4brew.knitting
---
- launchApp
# Modal powitalny (OnboardingModal) przy pierwszym uruchomieniu zasłania zakładki — zamykamy go, gdy jest (DEC-35)
- runFlow:
    when:
      visible:
        id: "onboarding-start-btn"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-start-btn"
      - tapOn:
          id: "onboarding-start-btn"
- tapOn: "Magazyn"
- assertVisible: "Magazyn"
- tapOn: "Dodaj włóczkę"
- inputText: "Sandnes Garn Sunday"
- tapOn: "Zapisz w magazynie"
- assertVisible: "Sandnes Garn Sunday"
- tapOn: "Zużyj 1 motek (-1)"
