appId: com.apps4brew.knitting
---
- launchApp
# Modal powitalny (OnboardingModal) przy pierwszym uruchomieniu zasłania zakładki — zamykamy go, gdy jest (DEC-35)
- runFlow:
    when:
      visible:
        id: "onboarding-start-btn"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-start-btn"
      - tapOn:
          id: "onboarding-start-btn"
- tapOn: "Licznik"
- assertVisible: "Rozpocznij"
- tapOn: "Rozpocznij"
- assertVisible: "Wstrzymaj"
- tapOn: "Wstrzymaj"
- assertVisible: "Wznów"
- tapOn: "Wznów"
