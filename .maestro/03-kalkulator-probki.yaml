appId: com.apps4brew.knitting
---
- launchApp
# Modal powitalny (OnboardingModal) przy pierwszym uruchomieniu zasłania zakładki — zamykamy go, gdy jest (DEC-35)
- runFlow:
    when:
      visible:
        id: "onboarding-start-btn"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-start-btn"
      - tapOn:
          id: "onboarding-start-btn"
- tapOn: "Warsztat"
- assertVisible: "Warsztat"
- tapOn: "Kalkulator Próbki"
- assertVisible: "Próbka ściegu (10 x 10 cm)"
- inputText: "22"
- inputText: "30"
- assertVisible: "Przeliczone oczka"
- tapOn: "Zamknij"
