appId: com.apps4brew.knitting
---
- launchApp
# Modal powitalny (OnboardingModal) przy pierwszym uruchomieniu zasłania zakładki — zamykamy go, gdy jest (DEC-35)
- runFlow:
    when:
      visible:
        id: "onboarding-start-btn"
    commands:
      - scrollUntilVisible:
          element:
            id: "onboarding-start-btn"
      - tapOn:
          id: "onboarding-start-btn"
- tapOn: "Ustawienia"
- assertVisible: "JĘZYK & SYSTEM JEDNOSTEK"
- tapOn: "Kopia zapasowa"
- assertVisible: "Utwórz kopię zapasową"
- tapOn: "Utwórz kopię zapasową"
- assertVisible: "Pomyślnie utworzono kopię zapasową"
