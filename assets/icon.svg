<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Oczko (Purlo) — Oficjalna ikona aplikacji Apps4Brew -->
  <!-- Nieprzezroczyste tło warm cream #FAF8F5 (wymóg Apple App Store) -->
  <rect width="1024" height="1024" fill="#FAF8F5"/>
  
  <g transform="translate(112, 112)">
    <!-- Cień kłębka włóczki -->
    <ellipse cx="400" cy="740" rx="280" ry="36" fill="#E6DFD5" opacity="0.8"/>

    <!-- Drut dziewiarski 1 (ukośny lewo-dół do prawo-góra) -->
    <line x1="80" y1="720" x2="720" y2="80" stroke="#8C7355" stroke-width="26" stroke-linecap="round"/>
    <!-- Końcówka drutu 1 (główka drewniana) -->
    <circle cx="80" cy="720" r="32" fill="#5C4033"/>

    <!-- Drut dziewiarski 2 (ukośny prawo-dół do lewo-góra) -->
    <line x1="720" y1="720" x2="80" y2="80" stroke="#8C7355" stroke-width="26" stroke-linecap="round"/>
    <!-- Końcówka drutu 2 (główka drewniana) -->
    <circle cx="720" cy="720" r="32" fill="#5C4033"/>

    <!-- Główny motek włóczki (Kłębek) -->
    <circle cx="400" cy="400" r="260" fill="#C85A32"/>
    
    <!-- Pasma / sploty włóczki wokół kłębka -->
    <path d="M220 320 C280 200, 520 200, 580 320 C620 400, 580 520, 500 580 C400 660, 260 580, 220 460 C200 400, 200 360, 220 320 Z" fill="none" stroke="#D96E47" stroke-width="28" stroke-linecap="round"/>
    <path d="M260 480 C300 600, 500 620, 560 500 C600 420, 540 300, 440 260 C340 220, 240 320, 260 480 Z" fill="none" stroke="#B34B26" stroke-width="24" stroke-linecap="round"/>
    <path d="M300 300 C360 380, 440 420, 520 360" fill="none" stroke="#FAF8F5" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <path d="M280 440 C340 500, 460 500, 500 420" fill="none" stroke="#FAF8F5" stroke-width="16" stroke-linecap="round" opacity="0.8"/>

    <!-- Luźna nitka z pętelką „Oczko” -->
    <path d="M520 540 C600 600, 680 580, 700 500 C720 420, 640 360, 600 420 C560 480, 620 580, 720 620 C780 644, 820 640, 850 630" fill="none" stroke="#C85A32" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
